<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Preview the Windows app's interface in a browser with a simulated host.
       Scenarios: ?scenario=empty | working | prompt | paused | listening | setup | light | connections | activity -->
  <base href="../../src/PocketAgent.Windows/Ui/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pocket Agent (preview)</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app" id="app">
    <nav class="rail" id="rail" aria-label="Pocket Agent"></nav>
    <main class="stage">
      <header class="statusbar" id="statusbar"></header>
      <section class="page flush" data-page="assistant" id="page-assistant"></section>
      <section class="page" data-page="activity" id="page-activity" hidden></section>
      <section class="page" data-page="connections" id="page-connections" hidden></section>
      <section class="page" data-page="approvals" id="page-approvals" hidden></section>
      <section class="page" data-page="settings" id="page-settings" hidden></section>
    </main>
  </div>
  <div class="setup" id="setup" hidden></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <script src="../../../tools/ui-preview/mock.js"></script>
  <script src="app.js"></script>
</body>
</html>
